<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Validação</title>
  <style>
    /* estilo da notificação */
    #notificacao {
      display: none; /* começa escondido */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      color: #fff;
      z-index: 9999;
    }
    #notificacao.sucesso {
      background-color: #28a745; /* verde */
    }
    #notificacao.erro {
      background-color: #dc3545; /* vermelho */
    }

    /* para dar um espaçamento */
    body {
      margin-top: 60px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Aqui fica a notificação -->
  <div id="notificacao"></div>

  <h1>Validação dos Campos</h1>
  <form id="formulario">
    <label for="campoA">Campo A:</label>
    <input type="number" id="campoA" name="campoA" required><br><br>

    <label for="campoB">Campo B:</label>
    <input type="number" id="campoB" name="campoB" required><br><br>

    <button type="submit">Enviar</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
